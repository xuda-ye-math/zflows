[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zflows"
version = "0.5.2"
description = "PyTorch normalizing flows for unconditional energy-based sampling. Strongly inspired by zuko."
authors = [{ name = "Xuda" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.10.0",
    "numpy>=2.4.0",
]

[tool.setuptools.packages.find]
include = ["zflows*"]
