name: Publish to PyPI

# Triggers on every pushed tag matching v* (e.g. v0.5.2, v0.6.0).
# Pair with `git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z`
# locally — no manual upload, no API token in repo secrets.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build sdist + wheel and publish
    runs-on: ubuntu-latest

    # Required for PyPI trusted publishing (OIDC).
    # `environment: pypi` ties the run to the PyPI publisher you configure
    # below and lets GitHub require manual approval before publish if you
    # later enable environment protection rules.
    environment:
      name: pypi
      url: https://pypi.org/p/zflows
    permissions:
      id-token: write

    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build backend
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify metadata + README rendering
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI (trusted publishing — no token needed)
        uses: pypa/gh-action-pypi-publish@release/v1
